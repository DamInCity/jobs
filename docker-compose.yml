version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jobs_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jobs_website}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5432 is often taken by local Postgres; app uses the Docker network name `postgres`
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobs_network

  # Node.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobs_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jobs_website}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@jobswebsite.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changethispassword}
      APP_URL: ${APP_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RAPIDAPI_MAX_REQUESTS_PER_RUN: ${RAPIDAPI_MAX_REQUESTS_PER_RUN:-80}
      INGEST_MAX_JOBS_PER_SOURCE: ${INGEST_MAX_JOBS_PER_SOURCE:-400}
      # Telegram digests (sendMessage) — same token as telegram-bot service
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      ALERT_LOOKBACK_DAYS: ${ALERT_LOOKBACK_DAYS:-30}
      ALERT_TEST_INTERVAL_MINUTES: ${ALERT_TEST_INTERVAL_MINUTES:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@jobswebsite.com}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.5}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      CV_UPLOAD_DIR: ${CV_UPLOAD_DIR:-/app/uploads/cvs}
      MAX_CV_BYTES: ${MAX_CV_BYTES:-5242880}
      TAILORED_RESUME_KEEP: ${TAILORED_RESUME_KEEP:-20}
    volumes:
      - cv_uploads:/app/uploads/cvs
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobs_network

  # Optional diagnostic: 1 matched Telegram job every N minutes for all linked users.
  # docker compose --profile alerts-test up -d alerts-test
  alerts-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobs_alerts_test
    restart: unless-stopped
    command: ["node", "src/jobs/emailAlerts.js", "--test-loop"]
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jobs_website}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      APP_URL: ${APP_URL:-http://localhost:3000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      ALERT_LOOKBACK_DAYS: ${ALERT_LOOKBACK_DAYS:-30}
      ALERT_TEST_INTERVAL_MINUTES: ${ALERT_TEST_INTERVAL_MINUTES:-5}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@jobswebsite.com}
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - jobs_network
    profiles:
      - alerts-test

  # Telegram link bot (long-polling). Job digests are sent by app/alerts job.
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobs_telegram_bot
    restart: unless-stopped
    command: ["node", "src/jobs/telegramBot.js"]
    # Dockerfile HEALTHCHECK hits :3000 — not applicable for this process
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jobs_website}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      APP_URL: ${APP_URL:-http://localhost:3000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.5}
      CV_UPLOAD_DIR: ${CV_UPLOAD_DIR:-/app/uploads/cvs}
      MAX_CV_BYTES: ${MAX_CV_BYTES:-5242880}
      TAILORED_RESUME_KEEP: ${TAILORED_RESUME_KEEP:-20}
    volumes:
      - cv_uploads:/app/uploads/cvs
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - jobs_network

  # Optional: run scrapers on a schedule (also fires alerts when jobs are saved)
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobs_scraper
    restart: unless-stopped
    command: ["node", "src/scrapers/scheduler.js", "--cron"]
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jobs_website}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      APP_URL: ${APP_URL:-http://localhost:3000}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RAPIDAPI_MAX_REQUESTS_PER_RUN: ${RAPIDAPI_MAX_REQUESTS_PER_RUN:-80}
      INGEST_MAX_JOBS_PER_SOURCE: ${INGEST_MAX_JOBS_PER_SOURCE:-400}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      ALERT_LOOKBACK_DAYS: ${ALERT_LOOKBACK_DAYS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@jobswebsite.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobs_network
    profiles:
      - scrapers

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: jobs_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - jobs_network
    profiles:
      - production

volumes:
  postgres_data:
  cv_uploads:

networks:
  jobs_network:
    driver: bridge
