<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Choose a new JobsHub password.">
  <meta name="theme-color" content="#FF4F5E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="JobsHub">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <title>Reset password - JobsHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
</head>
<body>
  <header class="header" id="siteHeader">
    <div class="container">
      <nav class="nav">
        <a href="/" class="logo">
          <span class="logo-mark" aria-hidden="true">J</span>
          <span class="logo-text">Jobs<span>Hub</span></span>
        </a>
        <div class="nav-links">
          <a href="/" class="nav-link">Jobs</a>
          <a href="/categories" class="nav-link">Explore</a>
          <a href="/alerts" class="nav-link">Alerts</a>
          <a href="/about" class="nav-link">About</a>
        </div>
        <div class="nav-actions">
          <div class="auth-buttons" id="authButtons">
            <a href="/login" class="btn btn-ghost">Sign in</a>
            <a href="/register" class="btn btn-primary">Get started</a>
          </div>
          <div class="user-menu hidden" id="userMenu">
            <button class="user-menu-btn" id="userMenuBtn" type="button">
              <span class="user-avatar" id="userAvatar">U</span>
              <span id="userName">User</span>
              <i class="fas fa-chevron-down" style="font-size:0.65rem;opacity:0.5"></i>
            </button>
            <div class="user-dropdown" id="userDropdown">
              <a href="/"><i class="fas fa-briefcase"></i> Browse jobs</a>
              <a href="/alerts"><i class="fas fa-bell"></i> Your alerts</a>
              <a href="/profile"><i class="fas fa-user"></i> Profile</a>
              <hr>
              <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sign out</a>
            </div>
          </div>
          <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Menu">
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <a href="/" class="mobile-nav-link">Jobs</a>
    <a href="/categories" class="mobile-nav-link">Explore</a>
    <a href="/alerts" class="mobile-nav-link">Alerts</a>
    <a href="/about" class="mobile-nav-link">About</a>
    <hr style="border:none;border-top:1px solid var(--border);margin:0.5rem 0">
    <div class="mobile-auth" id="mobileAuth">
      <a href="/login" class="btn btn-ghost btn-block">Sign in</a>
      <a href="/register" class="btn btn-primary btn-block">Get started</a>
    </div>
  </div>

  <main class="page-main auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Choose a new password</h1>
        <p>Use at least 8 characters. You’ll sign in right after.</p>
      </div>

      <div class="alert alert-error hidden" id="authError" role="alert"></div>
      <div class="alert alert-success hidden" id="authSuccess" role="status"></div>

      <form id="resetForm" class="auth-form" novalidate>
        <input type="hidden" id="resetToken" name="token" value="">
        <div class="form-group">
          <label class="form-label" for="password">New password</label>
          <div class="input-with-icon">
            <i class="fas fa-lock"></i>
            <input class="form-input" type="password" id="password" name="password" required autocomplete="new-password" placeholder="••••••••" minlength="8">
            <button type="button" class="input-icon-btn" data-toggle-password aria-label="Show password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm password</label>
          <div class="input-with-icon">
            <i class="fas fa-lock"></i>
            <input class="form-input" type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="••••••••" minlength="8">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Update password
        </button>
      </form>

      <p class="auth-footer-text">
        <a href="/login">Back to sign in</a>
        ·
        <a href="/forgot-password">Request a new link</a>
      </p>
    </div>
  </main>

  <footer class="footer" data-site-footer></footer>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
